[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sport-analysis-app"
version = "0.1.0"
description = "Multi-sport video analysis platform with wearable/laser integration and automated highlight generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Philip Kwimba"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video :: Analysis",
]
dependencies = [
    # Core CV & Detection
    "ultralytics>=8.2",
    "supervision>=0.21",
    "opencv-python>=4.9",
    "numpy>=1.24",
    "torch>=2.0",

    # Wearable Data
    "fitdecode>=0.10",
    "bleak>=0.21",
    "openant>=1.3",
    "scikit-digital-health>=0.14",
    "floodlight>=0.4",

    # Laser/LiDAR
    "open3d>=0.18",
    "laspy>=2.5",

    # Biometrics & Signal Processing
    "scipy>=1.11",
    "scikit-learn>=1.3",

    # Config & Models
    "pyyaml>=6.0",
    "pydantic>=2.0",

    # Video Processing
    "moviepy>=1.0",

    # Audio Analysis
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.5",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=11.0",
]
dashboard = [
    # Dashboard is a separate Node.js project
]
gpu = [
    "torch>=2.0+cu118",
    "onnxruntime-gpu>=1.15",
]

[project.scripts]
sport-analyze = "src.core.pipeline:main"
download-models = "scripts.download_models:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "PT"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
