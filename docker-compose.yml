services:
  # ─────────────────────────────────────────────────────────────────────────────
  # API BACKEND
  # ─────────────────────────────────────────────────────────────────────────────
  # Database is Supabase PostgreSQL (not a local container).
  # Supabase API creates/provisions the DB — no port conflict with any local DB.
  api:
    build: .
    command: .venv/bin/python -m src.api.main
    volumes:
      - .:/app
      - /mnt/data/videos:/app/data/videos       # Local HDD media storage
      - /mnt/data/processed:/app/data/processed  # Processed outputs (GDPR: 90-day retention)
      - ./models:/app/models                    # Model weights (loaded at runtime, not in repo)
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      # Supabase connection (set via .env or Doppler)
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ikambili34@gmail.com,ikambili34@live.com
      STORAGE_PATH: /mnt/data/videos
      RETENTION_DAYS: "90"

  # ─────────────────────────────────────────────────────────────────────────────
  # DASHBOARD (React dev server)
  # ─────────────────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/index.html:/app/index.html
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX (static assets + media proxy)
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - /mnt/data/videos:/media/videos:ro        # GDPR: read-only, no public upload
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
    command: [nginx-debug, '-g', 'daemon off;']
