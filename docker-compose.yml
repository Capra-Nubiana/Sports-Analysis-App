services:
  # ─────────────────────────────────────────────────────────────────────────────
  # DATABASE (local dev)
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sports_analysis
      POSTGRES_USER: sports_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"

  # ─────────────────────────────────────────────────────────────────────────────
  # API BACKEND
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build: .
    command: .venv/bin/python -m src.api.main
    volumes:
      - .:/app
      - /mnt/data/videos:/app/data/videos       # Local HDD media storage
      - /mnt/data/processed:/app/data/processed  # Processed outputs (GDPR: 90-day retention)
      - ./models:/app/models                    # Model weights (not committed, loaded at runtime)
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://sports_user:dev_password@db:5432/sports_analysis

  # ─────────────────────────────────────────────────────────────────────────────
  # DASHBOARD (React dev server)
  # ─────────────────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/index.html:/app/index.html
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX (static assets + media proxy)
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - /mnt/data/videos:/media/videos:ro        # GDPR: read-only, no public upload
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
    command: [nginx-debug, '-g', 'daemon off;']

volumes:
  postgres_data:
