name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - feature/*
      - develop

jobs:
  test-and-lint:
    name: Run Lints and Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Gitleaks (Secret Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config_path: .gitleaks.toml

      - name: Check code formatting (Black)
        run: |
          pip install black
          black --check src/ tests/
        continue-on-error: true # Warning only for now
        
      - name: Run Pytests
        run: |
          pytest tests/ -v --tb=short
          
  branch-routing-check:
    name: Enforce Linear Merge Pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify Target Branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR from $HEAD_REF to $BASE_REF"
          if [[ "$BASE_REF" == "develop" && ! "$HEAD_REF" =~ ^feature/.* ]]; then
            echo "::error::Only feature/* branches can merge into 'develop'."
            exit 1
          fi
          
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "develop" ]]; then
            echo "::error::Only 'develop' can merge into 'main'."
            exit 1
          fi
